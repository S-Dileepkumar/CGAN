[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgan"
version = "0.1.0"
description = "CGAN: Causal Gradient Accumulation Network (research prototype)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "<YOUR NAME>" }]
dependencies = ["torch>=2.1", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
report = ["matplotlib"]
baselines = ["mamba-ssm", "flash-linear-attention"]
triton = ["triton"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
