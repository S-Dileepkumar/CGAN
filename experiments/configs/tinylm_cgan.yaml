task:
  name: tiny_lm
  path: data/tiny_lm/train.txt
  seq_len: 256
  vocab: 256
model:
  name: cgan
  d_model: 256
  rank: 8
  n_layers: 4
  dropout: 0.1
  scan: chunk
  chunk_size: 64
train:
  steps: 20000
  batch_size: 32
  lr: 0.0006
  weight_decay: 0.1
  eval_every: 500
  eval_batches: 20
  seed: 0
  device: null
  out: results/logs/tinylm_cgan
